# Builds naga.srin.cc (a static Zola site, see Dockerfile) and the
# now-playing API (see now-playing/Dockerfile) in CI, pushes both to
# GHCR, then deploys compose.yaml to a VPS over SSH. The VPS never
# builds anything — it only pulls the images CI just pushed. A .env
# (holding the now-playing service's Spotify credentials, plus the
# exact image digests to run — see below) is generated on the VPS
# from GitHub secrets/outputs on every deploy; the static site itself
# still has no server-side secrets of its own.
#
# compose.yaml pins images by digest (${SITE_IMAGE}/${NOW_PLAYING_IMAGE},
# resolved from this workflow's build-and-push outputs), not by the
# :latest tag, so prod always runs an exact, reproducible artifact.
# Base images in both Dockerfiles are pinned by digest too, so
# rebuilding an old commit reproduces the same image content. To roll
# back, revert or check out the old commit and re-run this workflow
# (push to main, or workflow_dispatch) — it rebuilds and redeploys
# that commit's exact original artifact.
#
# Required secrets, scoped to the "prod" GitHub Environment (Settings →
# Environments → prod → Environment secrets — NOT repo-level secrets;
# the `deploy` job below opts into that environment so it can read them):
#   VPS_HOST                - VPS IP/hostname
#   VPS_USER                - SSH user to deploy as
#   VPS_SSH_KEY              - private half of a dedicated deploy keypair
#                              (public half goes in that user's
#                              ~/.ssh/authorized_keys on the VPS)
#   GHCR_PAT                 - classic PAT with `read:packages` scope, so
#                              the VPS can pull images from GHCR. Required
#                              because the package is private; if it's
#                              ever made public, this secret and the
#                              docker-login step in the deploy script can
#                              be dropped.
#   SPOTIFY_CLIENT_ID        - now-playing service: Spotify app client id
#   SPOTIFY_CLIENT_SECRET    - now-playing service: Spotify app client secret
#   SPOTIFY_REFRESH_TOKEN    - now-playing service: refresh token from the
#                              one-time OAuth authorization (see
#                              now-playing/README.md for how to obtain it)
#
# Variables (not secrets — Settings → Environments → prod → Variables,
# or repo-level variables under Settings → Secrets and variables → Actions):
#   VPS_APP_DIR  - path on the VPS holding compose.yaml (falls back
#                  to /opt/naga-site if unset)
#
# One-time VPS setup (not automated):
#   mkdir -p /opt/naga-site
#   # add the deploy keypair's public half to this user's ~/.ssh/authorized_keys
#   # the "proxy" external network (compose.yaml) must already exist —
#   # create it once with `docker network create proxy` if the reverse
#   # proxy didn't already set it up, then point the reverse proxy at this
#   # container (service "web", port 80)
#   # for now-playing: point DNS for api.srin.cc at this VPS, then point
#   # the reverse proxy at the "now-playing" container, port 8080

name: Deploy prod

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      site-digest: ${{ steps.build-site.outputs.digest }}
      now-playing-digest: ${{ steps.build-now-playing.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: build-site
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nagasrinath/naga-site:${{ github.sha }}
            ghcr.io/nagasrinath/naga-site:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: build-now-playing
        uses: docker/build-push-action@v7
        with:
          context: ./now-playing
          push: true
          tags: |
            ghcr.io/nagasrinath/now-playing:${{ github.sha }}
            ghcr.io/nagasrinath/now-playing:latest
          cache-from: type=gha,scope=now-playing
          cache-to: type=gha,mode=max,scope=now-playing

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "compose.yaml"
          target: ${{ vars.VPS_APP_DIR || '/opt/naga-site' }}
          strip_components: 0

      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ vars.VPS_APP_DIR || '/opt/naga-site' }}"
            cat > .env <<'EOF'
            SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
            SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
            SPOTIFY_REFRESH_TOKEN=${{ secrets.SPOTIFY_REFRESH_TOKEN }}
            ALLOWED_ORIGIN=https://naga.srin.cc
            SITE_IMAGE=ghcr.io/nagasrinath/naga-site@${{ needs.build-and-push.outputs.site-digest }}
            NOW_PLAYING_IMAGE=ghcr.io/nagasrinath/now-playing@${{ needs.build-and-push.outputs.now-playing-digest }}
            EOF
            chmod 600 .env
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker compose -f compose.yaml pull
            docker compose -f compose.yaml up -d
            docker image prune -f
            docker logout ghcr.io
