server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    # Both spellings of each type: nginx's bundled mime.types has changed
    # which one it maps these extensions to across versions (.js is
    # text/javascript since 1.21.1, .xml is text/xml), and gzip_types
    # matches on the resolved Content-Type, not the extension.
    gzip_types
        text/css
        text/javascript application/javascript
        text/xml application/xml application/atom+xml application/rss+xml
        text/plain
        image/svg+xml;

    error_page 404 /404.html;

    # HTML is the cache entry point and must stay fresh — everything it
    # references is fingerprinted, so revalidating just this is enough.
    add_header Cache-Control "no-cache";

    # style.css and *.js are requested with Zola's ?h=<hash> cachebust, and
    # the fonts are versioned by filename, so all of them are safe to freeze.
    # An add_header here replaces the server-level one rather than adding to
    # it, which is the behaviour we want.
    # One add_header, not `expires` plus an add_header — those emit two
    # separate Cache-Control headers.
    location ~* \.(?:css|js|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
