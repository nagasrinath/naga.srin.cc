services:
  naga-site:
    container_name: naga-site
    image: ghcr.io/nagasrinath/naga-site:latest
    restart: unless-stopped
    networks: [proxy]

  now-playing:
    container_name: now-playing
    image: ghcr.io/nagasrinath/now-playing:latest
    restart: unless-stopped
    env_file: .env
    networks: [proxy]

networks:
  proxy:
    external: true
