services:
  naga-site:
    container_name: naga-site
    image: ${SITE_IMAGE}
    restart: unless-stopped
    networks: [proxy]

  now-playing:
    container_name: now-playing
    image: ${NOW_PLAYING_IMAGE}
    restart: unless-stopped
    env_file: .env
    networks: [proxy]

networks:
  proxy:
    external: true
